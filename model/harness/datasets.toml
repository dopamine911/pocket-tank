          "out/data/fish26b-cov/gen-*-nofood0.6.jsonl"]
sha256 = "d06a7e28c49b7fa41f5226e3cdfca37f2ef574014c2fe2b911bb6f3c5cff50cf"   # 29,299 pairs, food none in 22.4% (was ~4%), 2026-11-10 08:31

