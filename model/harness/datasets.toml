["fish-v4-csim"]
# issue #1: candidate 3's recipe on states from the device's own tank code: 28,045 states from 72 round-sim runs
# (sim/fishsim-round --selftest-llm 20, POCKET_DUMP_STATES; keeper every 60 s / 600 s; candidate 3 / stock driving;
# seeds 101-118; light off at 10 min in a third). 26B labels seeds 101-109 (ls 6001); 31B 110-114 (zaphod card 1, ls 6002),
# 115-116 (marvin, ls 6003) and 117-118 (zaphod card 2, ls 6005); the 26B relabels the 31B's hunger 1-3 food-in-view pairs (ls 6004); + big's dart shard.
schema = "4"
traces = ["out/cstates/lab-26b.jsonl", "out/cstates/kept-31b.jsonl", "out/cstates/relabel26b-31b-s[01]of2.jsonl",
          "out/data/big-play/gen-*-ls3611-*-play0.6.jsonl"]
