# Seeds 4-6 of fish-14m-all (more seeds: the sweep's seed-to-seed spread was as large as the size effects; issue #1).
# issue #1 size sweep: fish-14m, loss on every token (as the shipped model),
# three seeds, the same data, iterations, batch and learning rate for every size; probes n=400 per case
# on panel seeds 11 and 23 (the decision rules: issue #1 comment, 2026-11-09 21:35).
model = "fish-14m"
dataset = "fish-v4-31b"
iters = 5000
batch = 64
lr = 6e-4
seeds = [4, 5, 6]
loss = "all"
mode = "training"
cpu = false
export = true

[[probes]]
n = 400
seed = 11

[[probes]]
n = 400
seed = 23
