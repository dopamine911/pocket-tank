# The harness end to end in a few minutes on the smallest fish: three short seeds, small probes,
# exports. Proves the plumbing, not a model: rows may FAIL.
model = "fish-d192-n4"
dataset = "fish-smoke"
iters = 300
batch = 64
lr = 6e-4
seeds = [1, 2, 3]
mode = "training"
cpu = false
export = true

[[probes]]
n = 40
seed = 11
