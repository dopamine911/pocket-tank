# Dart fix (issue #1, rule posted 2026-11-10 12:50): fish-d256-n6-decision on fish-v4-mix-cov-play, seeds 1-3; only the dataset changed.
# issue #1 size sweep: fish-d256-n6, loss on the decision tokens only (pocket-terrarium PR #9),
# three seeds, the same data, iterations, batch and learning rate for every size; probes n=400 per case
# on panel seeds 11 and 23 (the decision rules: issue #1 comment, 2026-11-09 21:35).
model = "fish-d256-n6"
dataset = "fish-v4-mix-cov-play"
iters = 5000
batch = 64
lr = 6e-4
seeds = [1, 2, 3]
loss = "decision"
mode = "training"
cpu = false
export = true

[[probes]]
n = 400
seed = 11

[[probes]]
n = 400
seed = 23
